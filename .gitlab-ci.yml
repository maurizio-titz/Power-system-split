image: python:3.7

before_script:
  - python --version
  - pip install -r requirements.txt
  - pip install . pytest pytest-cov pylint


stages:
  - Static Analysis
  - Test


doctest:
  stage: Static Analysis
  script:
    - python -m doctest README.md


