image: python:3.7

before_script:
  - python --version
  - pip install -r requirements.txt
  - pip install . pytest pytest-cov pylint


stages:
  - Static Analysis
  - Test

testing:
  stage: Static Analysis
  script:
    - python -m pytest --cov=power_system_split tests/

pylint:
  stage: Static Analysis
  allow_failure: true
  script:
  - pylint -d C0301 power_system_split/*.py

doctest:
  stage: Test
  script:
    - python -m doctest README.md


