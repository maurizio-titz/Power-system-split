[project]
name = "power-system-split"
version = "0.1.0"
description = "Determine the likelihood and severity of system splits."
readme = "README.md"
authors = [
    {name = "Franz Kaiser"},
    {name = "Johannes Kruse"},
    {name = "Maurizio Titz"},
    {name = "Philipp C. Böttcher"},
    {name = "Jan Lange"},
    {name = "Martha Frysztacki"}
]
requires-python = "==3.11.8"
dependencies = [
    "cartopy>=0.22",
    "cmap>=0.6.2",
    "hdbscan>=0.8.38",
    "joblib>=1.3",
    "loguru>=0.7",
    "matplotlib>=3.8",
    "tables>=3.9",
    "networkx==3.2.1",
    "numpy==1.26.4",
    "pandas==2.2.1",
    "pyparsing==3.1.1",
    "pypsa==0.35.0",
    "scikit_learn>=1.8",
    "typing-extensions>=4.10"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripts*", "utils*", "scenario_generation*"]
namespaces = false
