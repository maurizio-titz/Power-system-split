# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#top-level-configuration
version: v2026.08.0
tutorial: false

# pinned to match the old PYPSA2 reference runs (2030), rather than falling
# back to planning_horizons (2050) as costs.year does when left unset
# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#costs
costs:
  year: 2030

# pinned to a fixed release (latest as 15/09/26)
data:
  costs:
    version: v0.15.0

# electricity-only model, no sector coupling
# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#sector
# enabled: false alone doesn't restrict the 1990 baseline used to scale co2_budget
# (determine_emission_sectors() in prepare_sector_network.py checks these flags
# individually, not `enabled`), so the other sectors must be disabled too or the
# CO2 budget fraction gets applied to whole-economy 1990 emissions instead of
# just the electricity sector.
sector:
  enabled: false
  transport: false
  heating: false
  industry: false
  agriculture: false

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#planning_horizons
# explicit for the SC-LOPF workflow (workflow/Snakefile), which needs to know the
# horizon to locate the solved network under submodules/pypsa-eur/results/
planning_horizons:
- 2050

# sweep over CO2 budget levels; each name below is defined in configs/scenarios.yaml
# and only overrides co2_budget.upper, everything else comes from this base config
# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#run
run:
  name:
    # - co2-0.6-de
    # - co2-0.6
    # - co2-0.5
    # - co2-0.4
    # - co2-0.3
    # - co2-0.2
    - co2-0.1
    # - co2-0.05
    # - co2-0.0
  scenarios:
    enable: true
    file: ../../configs/scenarios.yaml

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#enable
enable:
  drop_leap_day: false

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#lines
lines:
  s_max_pu: 0.7 #Correction factor for line capacities (s_nom) to approximate N-1 security and reserve capacity


# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#electricity
electricity:
  transmission_limit: v1.0 # was scenario.ll: [v1.0]

  base_network: osm

  extendable_carriers:
    Generator: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float]
    StorageUnit: [battery, H2]
    Store: [] # battery, H2

  # Nuclear/Hard Coal/Lignite are kept in the fleet (not excluded) - conventional_carriers
  # below allows them as non-extendable existing capacity.
  powerplants_filter: DateOut >= 2024 or DateOut.isnull()
  custom_powerplants: DateIn <= 2024 and (DateOut >= 2024 or DateOut.isnull())

  conventional_carriers: [nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, biomass]
  renewable_carriers: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, hydro]

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#energy
energy:
  energy_totals_year: 2013
  base_emissions_year: 1990

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#clustering
clustering:
  simplify_network:
    to_substations: false
  cluster_network:
    n_clusters: 600 # was scenario.clusters: [50]
    algorithm: kmeans
  temporal:
    averaging: 3h # was clustering.temporal.resolution_elec: 3H

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#solving
solving:
  options:
    assign_all_duals: true
